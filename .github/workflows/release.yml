name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.20.4", "1.21", "1.21.1", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.mc }}
        working-directory: versions/${{ matrix.mc }}
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jar-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
