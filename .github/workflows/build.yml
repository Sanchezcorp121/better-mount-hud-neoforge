name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.21.1", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ${{ matrix.mc }}
        working-directory: versions/${{ matrix.mc }}
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bettermounthud-neoforge-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/build/libs/*.jar
